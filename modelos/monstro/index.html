<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monstro — modelo 3D</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #141312; color: #d9d2c8; font: 14px/1.4 Georgia, serif; overflow: hidden; }
  canvas { display: block; }
  .ui { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
  .ui button, .ui a { background: #24211f; color: #d9d2c8; border: 1px solid #3d3833; border-radius: 4px; padding: 7px 12px; font: inherit; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; cursor: pointer; text-decoration: none; }
  .ui button:hover, .ui a:hover { background: #332e2a; }
  .ui button.on { border-color: #9c7f63; }
  h1 { position: fixed; top: 14px; left: 18px; margin: 0; font-weight: normal; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #a39a8e; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #8d857a; pointer-events: none; }
  body.shot h1, body.shot .ui { display: none; }
</style>
</head>
<body>
<h1>Monstro &middot; 2,5 m</h1>
<div id="msg">carregando modelo…</div>
<div class="ui">
  <button data-v="frente">Frente</button>
  <button data-v="esquerdo">Lado esquerdo</button>
  <button data-v="tras">Trás</button>
  <button data-v="direito">Lado direito</button>
  <button data-v="rosto">Rosto</button>
  <button id="girar">Girar</button>
  <a href="monstro.glb" download>Baixar .glb</a>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
if (q.has('shot')) document.body.classList.add('shot');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161514);
scene.fog = new THREE.Fog(0x161514, 7, 14);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.6; controls.maxDistance = 12;

// luz de estúdio: principal quente, recorte frio por trás, preenchimento suave
const key = new THREE.DirectionalLight(0xfff1e2, 2.6);
key.position.set(2.5, 4.5, 3.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 3.2, bottom: -0.5, near: 0.5, far: 12 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfdcff, 1.6); rim.position.set(-3, 3, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffe0d0, 0.9); rim2.position.set(3.5, 2, -3); scene.add(rim2);
scene.add(new THREE.HemisphereLight(0xb8aea4, 0x1a1512, 0.5));

const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshStandardMaterial({ color: 0x131211, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const VISTAS = {
  frente:   { p: [0, 1.45, 7.6], t: [0, 1.3, 0] },
  esquerdo: { p: [-7.6, 1.45, 0], t: [0, 1.3, 0] },
  tras:     { p: [0, 1.45, -7.6], t: [0, 1.3, 0] },
  direito:  { p: [7.6, 1.45, 0], t: [0, 1.3, 0] },
  rosto:    { p: [0.55, 2.3, 1.9], t: [0, 2.2, 0.2] },
  tresq:    { p: [4.4, 2.0, 5.6], t: [0, 1.25, 0] },
};
function vista(nome) {
  const v = VISTAS[nome] || VISTAS.tresq;
  camera.position.set(...v.p); controls.target.set(...v.t); controls.update();
  document.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === nome));
}
document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { girar = false; vista(b.dataset.v); });
let girar = !q.has('shot');
document.getElementById('girar').onclick = () => (girar = !girar);
vista(q.get('vista') || 'tresq');

new GLTFLoader().load(q.get('glb') || 'monstro.glb', (g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const m = o.material;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    if (m.map) return;                      // modelo com textura: mantém o material original
    if (!o.geometry.attributes.color) {     // só a forma: material de argila
      o.material = new THREE.MeshStandardMaterial({ color: 0xb59a8c, roughness: 0.6 });
      return;
    }
    if (!['Pele', 'Dentes', 'Garras', 'Olhos'].includes(o.name)) { // modelo externo com cor por vértice
      o.material = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.5, metalness: 0, clearcoat: 0.15, clearcoatRoughness: 0.4 });
      return;
    }
    o.material = new THREE.MeshPhysicalMaterial({
      vertexColors: true, roughness: m.roughness, metalness: 0,
      clearcoat: o.name === 'Olhos' ? 1 : o.name === 'Pele' ? 0.25 : 0.5,
      clearcoatRoughness: o.name === 'Pele' ? 0.45 : 0.1,
      sheen: o.name === 'Pele' ? 0.4 : 0, sheenColor: new THREE.Color(0xd08070), sheenRoughness: 0.6,
    });
  });
  // normaliza: 2,5 m de altura, pés no chão, centralizado
  const box = new THREE.Box3().setFromObject(g.scene), size = box.getSize(new THREE.Vector3());
  const k = 2.5 / size.y;
  g.scene.scale.multiplyScalar(k);
  const c = box.getCenter(new THREE.Vector3());
  g.scene.position.set(-c.x * k, -box.min.y * k, -c.z * k);
  scene.add(g.scene);
  document.getElementById('msg').remove();
  if (q.has('shot')) { renderer.setAnimationLoop(null); controls.update(); renderer.render(scene, camera); }
  window.PRONTO = true;
}, undefined, (e) => { document.getElementById('msg').textContent = 'erro ao carregar: ' + e.message; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (girar) { const a = 0.0035, p = camera.position, t = controls.target; const x = p.x - t.x, z = p.z - t.z; p.x = t.x + x * Math.cos(a) - z * Math.sin(a); p.z = t.z + x * Math.sin(a) + z * Math.cos(a); }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
